name: CI

on:
  push:
    branches: [main]
  # No `branches` filter: a stacked PR targets its parent branch rather than
  # main, and a base filter here would silently give it zero checks.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least privilege for the GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions):
# CI only checks out and builds, so it needs read access to the contents and nothing else.
permissions:
  contents: read

jobs:
  test:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result: a macOS-only break (e.g. the vendored
      # PostgreSQL sources in pg_query failing against a newer Xcode SDK) must
      # not be masked by Linux passing, nor cancel the Linux job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # Third-party actions are pinned to a full commit SHA: a tag or branch can be
      # moved to different code after review, a SHA cannot. Dependabot
      # (.github/dependabot.yml) proposes the bumps, keeping the trailing comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev clang libssl-dev pkg-config protobuf-compiler

      # Only protoc is installed here: pg_query's build also needs libclang
      # (via bindgen), but the runner already ships it with the Xcode Command
      # Line Tools, so bindgen finds it without brew's llvm or LIBCLANG_PATH.
      # If a future runner image drops the CLT, add `llvm` here and export
      # LIBCLANG_PATH=$(brew --prefix llvm)/lib (see CONTRIBUTING.md).
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all
