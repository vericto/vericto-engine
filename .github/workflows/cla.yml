# Contributor License Agreement check, run in GitHub Actions. It replaces
# cla-assistant.io, whose webhook failed on every delivery on 2026-10-17 and
# 2026-10-18 and left pull requests without a status.
#
# CLA Assistant Lite asks every commit author of a pull request who has not
# signed the Vericto ICLA (legal/cla/1.1.md, v1.1) to sign it by commenting
#   I have read the CLA Document and I hereby sign the CLA
# and records the signature (GitHub login and id, comment id, time, pull
# request) in signatures/v1.1/cla.json on the `cla-signatures` branch of this
# repository. The branch already exists; the workflow creates the v1.1 file
# on the first signature. Do not create that file by hand. Commenting `recheck`
# reruns the check.
#
# Safety: pull_request_target runs this file from the base branch with a
# write token, for pull requests from forks too. It must never check out,
# build or run code from the pull request: there is no actions/checkout here
# and none may be added. The action reads the pull request's commits and
# comments through the API only, and the comment text is only compared in
# `if:`, never passed to a shell.
#
# The job name `CLA` is a required status check in the branch ruleset: keep it.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions: {}

jobs:
  cla:
    name: CLA
    # Every pull request event; on comments, only the two the action acts on,
    # and only on pull requests (issue_comment also fires on issues).
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # rerun the pull request's failed CLA run after a signature
      contents: write # commit signatures to the cla-signatures branch
      pull-requests: write # post and update the comment, lock the closed pull request
    steps:
      # Harden the archived action's known limits. It reads only the first 100
      # commits and the first page of comments, falls back from an unlinked
      # author to the committer, and does not inspect Co-authored-by trailers.
      # This base-branch script paginates, rejects unsupported authorship and
      # records an exact signature comment before the action runs. It never
      # checks out or executes pull-request code.
      - name: Validate authorship and record an exact signature
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = context.issue.number || context.payload.pull_request?.number;
            const claVersion = "1.1";
            const claDocumentSha256 = "2e68144074fba8c31aeece81011217388467589a9f133aa2271cb76852931f7a";
            const claFile = (await github.rest.repos.getContent({
              owner, repo, path: "legal/cla/1.1.md", ref: context.payload.repository.default_branch,
            })).data;
            const actualClaSha256 = require("crypto")
              .createHash("sha256")
              .update(Buffer.from(claFile.content, "base64"))
              .digest("hex");
            if (actualClaSha256 !== claDocumentSha256) {
              core.setFailed("legal/cla/1.1.md changed without a new CLA version and signature path");
              return;
            }
            if (!number) {
              core.setFailed("CLA check could not identify the pull request");
              return;
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: number, per_page: 100,
            });
            if (commits.length > 100) {
              core.setFailed("CLA verification supports at most 100 commits; split this pull request");
              return;
            }

            const allowedBots = new Set(["dependabot[bot]", "github-actions[bot]"]);
            const humans = new Map();
            for (const commit of commits) {
              if (/^Co-authored-by:/mi.test(commit.commit.message)) {
                core.setFailed(`Commit ${commit.sha} has Co-authored-by trailers; use separate commits so every human can sign`);
                return;
              }
              const author = commit.author;
              if (!author) {
                core.setFailed(`Commit ${commit.sha} has no GitHub-linked author; link the author email or amend it`);
                return;
              }
              if (author.type === "Bot" || author.login.endsWith("[bot]")) {
                if (!allowedBots.has(author.login) || commit.commit.verification?.verified !== true) {
                  core.setFailed(`Commit ${commit.sha} is attributed to an unapproved or unverified bot`);
                  return;
                }
              } else {
                humans.set(author.id, { name: author.login, id: author.id });
              }
            }

            if (context.eventName !== "issue_comment" ||
                context.payload.comment.body !== "I have read the CLA Document and I hereby sign the CLA") {
              return;
            }
            const signer = context.payload.comment.user;
            if (!humans.has(signer.id)) {
              core.setFailed("Only a human commit author on this pull request may sign its CLA");
              return;
            }

            const path = "signatures/v1.1/cla.json";
            const branch = "cla-signatures";
            const getFile = async () => github.rest.repos.getContent({ owner, repo, path, ref: branch });
            let file;
            try {
              file = (await getFile()).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              file = null;
            }
            const data = file
              ? JSON.parse(Buffer.from(file.content, "base64").toString("utf8"))
              : { signedContributors: [] };
            if (!data.signedContributors.some(entry => entry.id === signer.id)) {
              data.signedContributors.push({
                name: signer.login,
                id: signer.id,
                comment_id: context.payload.comment.id,
                created_at: context.payload.comment.created_at,
                repoId: context.payload.repository.id,
                pullRequestNo: number,
                cla_version: claVersion,
                cla_document_sha256: claDocumentSha256,
              });
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch,
                message: `${signer.login} signed Vericto CLA 1.1 in #${number}`,
                content: Buffer.from(JSON.stringify(data, null, 2) + "\n").toString("base64"),
                ...(file?.sha ? { sha: file.sha } : {}),
              });
            }

      # The archived action posts the contributor prompt, checks the v1.1
      # records and reruns a failed pull_request_target check after signing.
      - name: Check the CLA signatures
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/legal/cla/1.1.md
          path-to-signatures: signatures/v1.1/cla.json
          branch: cla-signatures
          # Exact logins, no wildcards: the maintainers and the bots that commit here.
          allowlist: dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before it can be merged, $you need to sign the
            [Vericto Individual Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/legal/cla/1.1.md),
            version 1.1. You keep the copyright in your contribution; the agreement gives
            Vericto S.A.S. a license to distribute it. Read it, including its description of
            the signature record and personal-data processing, then sign by posting a comment
            on this pull request with exactly the sentence below. If an employer or client may
            own your contribution, obtain its written authorization first.<br/>
          # Keep the signature comment on record once the pull request is closed.
          lock-pullrequest-aftermerge: true
