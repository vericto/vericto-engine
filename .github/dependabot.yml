# Keeps the SHA-pinned GitHub Actions current, and proposes Cargo updates once
# a month in a single grouped PR.
#
# pg_query and sqlparser are left out of the version updates: an upgrade of
# either can change how SQL is parsed, so it is done by hand with its own
# CHANGELOG entry. Security fixes are not missed for them: Dependabot security
# updates are on in the repository settings, and the `supply-chain` CI job
# (cargo-deny + cargo-audit) fails every PR while a RustSec advisory applies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: pg_query
      - dependency-name: sqlparser
      # Major bumps change APIs; they are done by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo:
        patterns: ["*"]
