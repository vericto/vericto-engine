[package]
name = "vericto-engine"
version = "3.8.1"
edition = "2024"
rust-version = "1.88"
description = "Vericto — Deterministic SQL AST evaluation engine (open core)"
license = "Elastic-2.0"
repository = "https://github.com/vericto/vericto-engine"
readme = "README.md"
keywords = ["sql", "security", "ast", "parser", "llm"]
categories = ["database", "parser-implementations"]

[lib]
name = "vericto_engine"
path = "src/lib.rs"

[dependencies]
# SQL parsing — AST engine
pg_query = "6.2"
sqlparser = "0.52"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Observability
tracing = "0.1"

# Utilities
thiserror = "1.0"

[dev-dependencies]
# Property-based testing for the engine's pure functions (Properties P1-P8).
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
