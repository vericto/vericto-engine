[package]
name = "vericto-engine"
version = "4.1.2"
edition = "2024"
rust-version = "1.88"
description = "Vericto — Deterministic SQL AST evaluation engine (open core)"
license = "Elastic-2.0"
repository = "https://github.com/vericto/vericto-engine"
readme = "README.md"
keywords = ["sql", "security", "ast", "parser", "llm"]
categories = ["database", "parser-implementations"]

[lib]
name = "vericto_engine"
path = "src/lib.rs"

[dependencies]
# SQL parsing — AST engine
pg_query = "6.2"
# `visitor`: the complete expression walk (`parser::walk::walk_rest`).
sqlparser = { version = "0.63", features = ["visitor"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Custom-rule YAML (`ast_condition_yaml`). serde_norway is the maintained fork of
# serde_yaml 0.9 (same parser, same `Value`, same error messages); serde_yaml
# itself is deprecated and its libyaml translation, unsafe-libyaml, is
# unmaintained (RUSTSEC-2024-0449).
serde_norway = "0.9.42"

# Observability
tracing = "0.1"

# Utilities
thiserror = "2.0"

[dev-dependencies]
# Property-based testing for the engine's pure functions (Properties P1-P8).
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
