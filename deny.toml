# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/), run by
# the `supply-chain` job in .github/workflows/ci.yml and locally with
# `cargo generate-lockfile && cargo deny check`.

[graph]
# The graph as a consumer builds it: default features, every target.
all-features = false

[advisories]
# Every RustSec vulnerability, unsound, unmaintained and yanked advisory fails
# the check. An exception goes in `ignore` with the advisory id and the reason,
# and is revisited when the dependency is next bumped.
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
# The licenses the dependency tree uses today. A dependency under any other
# license fails the check until it has been reviewed and added here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# This crate's own license (FSL-1.1-ALv2 since 4.3.0) is allowed for this crate
# only, so a dependency under a source-available license still fails the check.
exceptions = [
    { allow = ["FSL-1.1-ALv2"], crate = "vericto-engine" },
]

[bans]
# Duplicate versions are reported, not failed: the tree has a few through
# pg_query's build dependencies and they are not worth pinning around.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Crates come from crates.io only: no other registry, no git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
